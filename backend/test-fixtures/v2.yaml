openapi: 3.0.0
info:
  title: Users API
  version: "2.0"
paths:
  /users/{id}:
    get:
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A user object
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  userName:
                    type: string
                  email:
                    type: string
                  status:
                    type: string
                    enum: [active, inactive, pending]
                  created_at:
                    type: string
                  avatar_url:
                    type: string
                required:
                  - id
                  - userName
                  - email
                  - created_at
  /users:
    post:
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                phone:
                  type: string
              required:
                - user_name
                - email
                - password
      responses:
        "201":
          description: Created